name: Feature request / 功能建议
description: Suggest an idea / 提出新想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 想解决的问题
      description: What are you trying to do, and why is it hard today? / 你想做什么，现在为什么不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议的方案
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的其它方案
