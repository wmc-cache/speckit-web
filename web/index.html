<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="speckit-web-mode" content="static" />
    <meta name="speckit-web-token" content="" />
    <title>Spec Kit Web</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        var s = localStorage.getItem('speckit-web.theme');
        var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
